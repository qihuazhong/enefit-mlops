[project]
name = "enefit"
version = "0.1.0"
description = "Enefit prosumer energy forecaster: Kaggle notebook (2023-24) productionized as an MLOps pipeline"
requires-python = ">=3.10,<3.11"
dependencies = [
    "lightgbm==4.7.0",
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scikit-learn==1.2.2",
    "scipy==1.14.1",
    "pyarrow",
    "matplotlib",
    "mlflow==3.10.1",
    "boto3[crt]==1.43.108",   # enefit.pipeline; crt: needed for the credentials of `aws login`
]

[project.optional-dependencies]
dev = ["pytest"]
# image only: lets MLflow talk to the SageMaker MLflow app (tracking URI = its ARN) and S3; locally it warns on every request
aws = ["sagemaker-mlflow==0.5.0"]
# local only (enefit.benchmarks): torch alone would add a few GB to the image, and no AWS job runs a benchmark
benchmarks = ["torch==2.14.1", "prophet==1.5.0", "statsmodels==0.15.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
